<!--new.html-->

{{ define "entries/new.html" }}
{{ template "base/header.html" .}}

{{ template "base/errors.html" . }}

<!-- Enhanced form styles are now in the main CSS file -->

<h3>Add an Entry</h3>
<form action="/entries/new" method="POST" id="entryForm">
    {{ CSRFInput .context }}
    <!-- Basic Information Section -->
    <div class="form-section">
        <h4>Basic Information</h4>
        
        <div class="form-group">
            <label for="name">Restaurant Name *</label>
            <input type="text" name="name" id="name" required data-tooltip="Enter the restaurant name">
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="visited" name="visited" value="true" checked data-tooltip="Check if you have visited this restaurant">
                I visited this restaurant
            </label>
        </div>

        <div class="form-group">
            <label for="location">Location *</label>
            <select id="location" name="location" required data-tooltip="Select the general area/direction of the restaurant">
                <option value="">Select Location</option>
                <option value="N">N</option>
                <option value="NE">NE</option>
                <option value="NW">NW</option>
                <option value="SW">SW</option>
                <option value="SE">SE</option>
                <option value="S">S</option>
            </select>
        </div>

        <div class="form-group">
            <label for="cuisine">Cuisine *</label>
            <input type="text" name="cuisine" id="cuisine" required data-tooltip="Type of cuisine (e.g., Italian, Mexican, Thai)">
        </div>
    </div>

    <!-- Conditional Fields for Unvisited Restaurants -->
    <div class="form-section conditional-fields" id="unvisitedFields">
        <h4>Looking Forward To</h4>
        
        <div class="form-group">
            <label for="lookingforwardto">What are you looking forward to? *</label>
            <input type="text" name="lookingforwardto" id="lookingforwardto" data-tooltip="What dishes or experiences are you excited to try?">
        </div>
    </div>

    <!-- Conditional Fields for Visited Restaurants -->
    <div class="form-section conditional-fields show" id="visitedFields">
        <h4>Visit Details</h4>
        
        <div class="form-group">
            <label for="mealservice">Meal Service</label>
            <select id="mealservice" name="mealservice" data-tooltip="What type of meal did you have?">
                <option value="">Select Meal Service</option>
                <option value="breakfast">Breakfast</option>
                <option value="brunch">Brunch</option>
                <option value="lunch">Lunch</option>
                <option value="happy_hour">Happy Hour</option>
                <option value="dinner">Dinner</option>
                <option value="drinks">Drinks</option>
                <option value="late_night">Late Night</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ordered">Items Ordered</label>
            <input type="text" name="ordered" id="ordered" data-tooltip="List items you ordered (separate multiple items with commas)">
        </div>

        <div class="form-group">
            <label for="ordernext">Order Next Visit</label>
            <input type="text" name="ordernext" id="ordernext" data-tooltip="Items you want to try on your next visit (separate with commas)">
        </div>

        <div class="form-group">
            <label for="donotorder">Don't Order Again</label>
            <input type="text" name="donotorder" id="donotorder" data-tooltip="Items you wouldn't order again (separate with commas)">
        </div>

        <!-- Rating Section -->
        <h4>Ratings</h4>
        
        <div class="rating-group">
            <div class="rating-field">
                <label for="foodrating">Food Rating</label>
                <select id="foodrating" name="foodrating" data-tooltip="Rate the food quality (1=Poor, 2=Fair, 3=Good, 4=Very Good, 5=Outstanding)">
                    <option value="0">Not Rated</option>
                    <option value="1" class="rating-option">1 - Poor: Disappointing experience</option>
                    <option value="2" class="rating-option">2 - Fair: Below average</option>
                    <option value="3" class="rating-option">3 - Good: Meets expectations</option>
                    <option value="4" class="rating-option">4 - Very Good: Highly recommended</option>
                    <option value="5" class="rating-option">5 - Outstanding: Exceptional experience</option>
                </select>
            </div>

            <div class="rating-field">
                <label for="ambiencerating">Ambience Rating</label>
                <select id="ambiencerating" name="ambiencerating" data-tooltip="Rate the atmosphere and ambience (1=Poor, 2=Fair, 3=Good, 4=Very Good, 5=Outstanding)">
                    <option value="0">Not Rated</option>
                    <option value="1" class="rating-option">1 - Poor: Disappointing experience</option>
                    <option value="2" class="rating-option">2 - Fair: Below average</option>
                    <option value="3" class="rating-option">3 - Good: Meets expectations</option>
                    <option value="4" class="rating-option">4 - Very Good: Highly recommended</option>
                    <option value="5" class="rating-option">5 - Outstanding: Exceptional experience</option>
                </select>
            </div>

            <div class="rating-field">
                <label for="valuerating">Value Rating</label>
                <select id="valuerating" name="valuerating" data-tooltip="Rate the value for money (1=Poor, 2=Fair, 3=Good, 4=Very Good, 5=Outstanding)">
                    <option value="0">Not Rated</option>
                    <option value="1" class="rating-option">1 - Poor: Disappointing experience</option>
                    <option value="2" class="rating-option">2 - Fair: Below average</option>
                    <option value="3" class="rating-option">3 - Good: Meets expectations</option>
                    <option value="4" class="rating-option">4 - Very Good: Highly recommended</option>
                    <option value="5" class="rating-option">5 - Outstanding: Exceptional experience</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="comments">Comments</label>
            <textarea name="comments" id="comments" rows="3" data-tooltip="Additional thoughts or comments about your experience"></textarea>
        </div>
    </div>

    <div class="action-buttons">
        <button type="submit" class="btn btn-success btn-form">Submit Entry</button>
    </div>
</form>

<!-- JavaScript functionality is now handled by the main dinnerclub.js file -->

{{ template "base/footer.html" .}}
{{ end }}
